name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:syntax
      - run: npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/openclaw-2026.7.1-2" openclaw@2026.7.1-2
      - run: |
          package_root="$RUNNER_TEMP/openclaw-2026.7.1-2/node_modules/openclaw"
          backup_root="$RUNNER_TEMP/openclaw-rich-media-backups"
          before=$(find "$package_root/dist" -type f -name '*.js' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          OPENCLAW_PACKAGE_ROOT="$package_root" npm run dry-run
          after=$(find "$package_root/dist" -type f -name '*.js' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"
          OPENCLAW_PACKAGE_ROOT="$package_root" OPENCLAW_HOTFIX_BACKUP_DIR="$backup_root" npm run apply
          OPENCLAW_PACKAGE_ROOT="$package_root" npm run check:installed
          for f in $(grep -l "hotfix: telegram-rich" "$package_root"/dist/*.js); do node --check "$f"; done
          # second apply must be a no-op (idempotent markers)
          OPENCLAW_PACKAGE_ROOT="$package_root" npm run apply | grep -q "complete changed=0"
